[build]
builder = "NIXPACKS"

[phases.setup]
nixPkgs = ["nodejs-22_x", "php82", "php82Extensions.exif"]

[deploy]
startCommand = "php artisan config:clear && php artisan cache:clear && php artisan route:clear && php artisan view:clear && php artisan migrate:fresh --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"